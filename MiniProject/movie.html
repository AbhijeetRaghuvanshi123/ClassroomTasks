<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUD Movie Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  body {
    background: #05070a;
    font-family: 'Share Tech Mono', monospace;
    color: #5fffd1;
    margin: 0;
    padding: 40px;
    overflow-x: hidden;

    /* HUD Background Grid */
    background-image:
      linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* HUD Panel Frame */
  .panel {
    width: 90%;
    max-width: 900px;
    margin: auto;
    padding: 25px;
    border: 2px solid #0ff;
    position: relative;
    box-shadow: 0 0 20px #0ff;
    background: rgba(0, 10, 20, 0.65);
    backdrop-filter: blur(4px);
  }

  /* Angled Corners */
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    border: 3px solid #ff6600;
  }

  .panel::before {
    top: -3px; left: -3px;
    border-bottom: none;
    border-right: none;
  }

  .panel::after {
    bottom: -3px; right: -3px;
    border-top: none;
    border-left: none;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 40px;
    text-shadow: 0 0 15px #0ff;
    letter-spacing: 2px;
  }

  /* Inputs */
  input {
    padding: 10px;
    width: 280px;
    border: 2px solid #0ff;
    background: transparent;
    color: #0ff;
    font-size: 16px;
    outline: none;
    text-align: center;
  }

  button {
    padding: 10px 20px;
    background: transparent;
    border: 2px solid #ff6600;
    color: #ff6600;
    margin-left: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #ff660033;
    box-shadow: 0 0 15px #ff6600;
  }

  /* Movie Card */
  .card {
    margin-top: 30px;
    display: flex;
    gap: 20px;
    border: 2px solid #0ff;
    padding: 20px;
    background: rgba(0, 20, 30, 0.6);
    box-shadow: 0 0 20px #0ff;
    position: relative;
  }

  .card::after {
    content: "";
    position: absolute;
    top: -2px; right: -2px;
    width: 18px; height: 18px;
    border: 2px solid #ff6600;
    border-top: none;
    border-left: none;
  }

  img {
    height: 300px;
    border: 2px solid #ff6600;
    box-shadow: 0 0 15px #ff6600;
  }

  .info p {
    margin: 5px 0;
    color: #aaffff;
  }

  .title {
    font-size: 24px;
    color: #ff6600;
    text-shadow: 0 0 10px #ff6600;
  }

  /* Glitch Effect for numbers/titles */
  .glitch {
    position: relative;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0.7;
  }
  .glitch::before {
    left: 2px;
    text-shadow: -2px 0 #ff0066;
    animation: glitch1 1s infinite linear alternate-reverse;
  }
  .glitch::after {
    left: -2px;
    text-shadow: 2px 0 #00ffff;
    animation: glitch2 1s infinite linear alternate-reverse;
  }

  @keyframes glitch1 {
    0% { clip-path: inset(0 0 20% 0); }
    50% { clip-path: inset(60% 0 30% 0); }
    100% { clip-path: inset(20% 0 0 0); }
  }

  @keyframes glitch2 {
    0% { clip-path: inset(60% 0 0 0); }
    50% { clip-path: inset(0 0 30% 0); }
    100% { clip-path: inset(20% 0 40% 0); }
  }

</style>
</head>

<body>

<h1 class="glitch" data-text="MOVIE SCANNER HUD">MOVIE SCANNER HUD</h1>

<div class="panel">
  <input type="text" id="movie" placeholder="ENTER MOVIE NAME">
  <button id="find">SCAN</button>

  <div id="resultbox"></div>
</div>

<script>
  const btn = document.querySelector("#find");
  const box = document.querySelector("#resultbox");

  btn.addEventListener("click", async () => {
    const name = document.querySelector("#movie").value.trim();
    if (!name) return alert("Enter movie name!");

    box.innerHTML = `<p style="color:#0ff;">Scanning...</p>`;

    const res = await fetch(`http://www.omdbapi.com/?t=${name}&apikey=dac83de7`);
    const data = await res.json();

    if (data.Response === "False") {
      box.innerHTML = `<p style="color:red;">NO DATA FOUND</p>`;
      return;
    }

    box.innerHTML = `
      <div class="card">
        <img src="${data.Poster}">
        <div class="info">
          <p class="title glitch" data-text="${data.Title}">${data.Title}</p>
          <p><strong>Year:</strong> ${data.Year}</p>
          <p><strong>Genre:</strong> ${data.Genre}</p>
          <p><strong>Rating:</strong> ⭐ ${data.imdbRating}</p>
          <p><strong>Director:</strong> ${data.Director}</p>
          <p><strong>Actors:</strong> ${data.Actors}</p>
          <p><strong>Runtime:</strong> ${data.Runtime}</p>
          <p><strong>Languages:</strong> ${data.Language}</p>
          <p><strong>Plot:</strong> ${data.Plot}</p>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
